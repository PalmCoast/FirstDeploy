[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Stale duplicate tree and deploy notes: never serve them (audit 2026-09-30).
[[redirects]]
  from = "/firstdeploy/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/firstdeploy"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/readme.md"
  to = "/404.html"
  status = 404
  force = true

# Function sources / deps live inside the publish dir; never serve them.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

[[redirects]]
  from = "/thanks"
  to = "/thanks.html"
  status = 200

[[redirects]]
  from = "/consult"
  to = "/consult.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/disclosure"
  to = "/disclosure.html"
  status = 200

[[redirects]]
  from = "/hive"
  to = "/hive.html"
  status = 200

[[redirects]]
  from = "/flick"
  to = "https://flick.firstdeploy.ai/"
  status = 301
  force = true

[[redirects]]
  from = "/flick.html"
  to = "https://flick.firstdeploy.ai/"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "/blog/index.html"
  status = 200

[[redirects]]
  from = "/blog/after-hours-playbook"
  to = "/blog/after-hours-playbook.html"
  status = 200

[[redirects]]
  from = "/blog/missed-after-hours-call-cost"
  to = "/blog/missed-after-hours-call-cost.html"
  status = 200

[[redirects]]
  from = "/blog/answering-service-vs-ai-phone-desk"
  to = "/blog/answering-service-vs-ai-phone-desk.html"
  status = 200

[[redirects]]
  from = "/blog/what-an-answering-service-costs"
  to = "/blog/what-an-answering-service-costs.html"
  status = 200

[[redirects]]
  from = "/vs/smith-ai"
  to = "/vs/smith-ai.html"
  status = 200

[[redirects]]
  from = "/vs/ruby"
  to = "/vs/ruby.html"
  status = 200

[[redirects]]
  from = "/vs/goodcall"
  to = "/vs/goodcall.html"
  status = 200

# Bot Wars is parked: battle-page-preview never merged (dates TBA, signup not live).
# /battle still draws visits, and /assets/battle/og-battle.png is the top 404.
# Send the page home. Point the missing share card at the live site OG image.
# No contest page or offer-price changes.
[[redirects]]
  from = "/battle"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/battle/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/battle.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/assets/battle/og-battle.png"
  to = "/og.png"
  status = 301
  force = true

# /go/:name is the click tracker. Bare /go and /go/ do not match it and 404.
# /go/start is the $1,750 pay-in-full Payment Link (302).
[[redirects]]
  from = "/go"
  to = "/go/start"
  status = 301
  force = true

[[redirects]]
  from = "/go/"
  to = "/go/start"
  status = 301
  force = true

# No /book, /contact, or /vs index. Home has the phone, the free-call button,
# and the comparison cards. Named /vs/* pages above stay as they are.
[[redirects]]
  from = "/book"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/book/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/contact/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/vs"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/vs/"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/og.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
